<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

    <!-- Sans-serif -> <- Fixedsys Excelsior -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Fixedsys Excelsior</family>
    </prefer>
  </alias>

  <!-- Serif -> Noto Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Cairopixel</family>
    </prefer>
  </alias>

  <!-- Monospace -> <- Fixedsys Excelsior -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fixedsys Excelsior</family>
    </prefer>
  </alias>

  <!-- Emoji -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>SerenityOS Emoji</string>
    </edit>
  </match>
  
  <!-- CJK -->
  <!-- <match target="pattern"> -->
  <!--   <edit name="family" mode="append_last"> -->
  <!--     <string>Noto Sans CJK JP</string> -->
  <!--   </edit> -->
  <!-- </match> -->

  <!-- Japanese -->
  <!-- Change JP symbols from original font to japanese-specific -->
  <match target="pattern">
    <test name ="lang" compare="contains">
        <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
        <string>Galmuri9</string>
    </edit>
  </match>

  <!-- Chinese -->
  <match target="pattern">
    <test name ="lang" compare="contains">
        <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
        <string>Galmuri9</string>
    </edit>
  </match>

</fontconfig>
